<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="-apple-system, 'PingFang SC', sans-serif">
  <rect width="680" height="340" fill="#f6f8fb"/>
  <!-- 增材层 (下) -->
  <g>
    <rect x="230" y="200" width="220" height="100" fill="#cdd9e6" stroke="#7c8ea3" stroke-width="2"/>
    <g stroke="#9aa7b4" stroke-width="1">
      <line x1="230" y1="220" x2="450" y2="220"/>
      <line x1="230" y1="240" x2="450" y2="240"/>
      <line x1="230" y1="260" x2="450" y2="260"/>
      <line x1="230" y1="280" x2="450" y2="280"/>
    </g>
  </g>
  <!-- 减材特征 (上) -->
  <g>
    <rect x="230" y="120" width="220" height="80" fill="#e6edf4" stroke="#7c8ea3" stroke-width="2"/>
    <rect x="300" y="120" width="80" height="40" fill="#f6f8fb" stroke="#1f6feb" stroke-width="1.5"/>
    <text x="340" y="146" text-anchor="middle" font-size="11" fill="#1450b0">铣削型腔</text>
    <line x1="230" y1="120" x2="230" y2="200" stroke="#7c8ea3" stroke-width="2"/>
  </g>
  <text x="340" y="320" text-anchor="middle" font-size="14" fill="#33414f">同一工件：下半增材、上半减材</text>
  <!-- 增材箭头 -->
  <g stroke="#0f9d8a" stroke-width="2" fill="#0f9d8a">
    <line x1="150" y1="250" x2="210" y2="250"/>
    <polygon points="210,250 202,246 202,254"/>
    <text x="120" y="254" text-anchor="end" font-size="12" stroke="none">增材(铺粉/熔融)</text>
  </g>
  <!-- 减材箭头 -->
  <g stroke="#e0742a" stroke-width="2" fill="#e0742a">
    <line x1="150" y1="160" x2="210" y2="160"/>
    <polygon points="210,160 202,156 202,164"/>
    <text x="120" y="164" text-anchor="end" font-size="12" stroke="none">减材(铣削)</text>
  </g>
  <!-- 说明 -->
  <text x="490" y="160" font-size="14" fill="#33414f">增减材复合：</text>
  <text x="490" y="186" font-size="13" fill="#6b7884">先用增材做近净形/</text>
  <text x="490" y="206" font-size="13" fill="#6b7884">内腔复杂结构，</text>
  <text x="490" y="226" font-size="13" fill="#6b7884">再用减材保证</text>
  <text x="490" y="246" font-size="13" fill="#6b7884">尺寸与表面质量</text>
  <text x="490" y="276" font-size="13" fill="#6b7884">适合单件、复杂、</text>
  <text x="490" y="296" font-size="13" fill="#6b7884">难切削材料件</text>
</svg>
