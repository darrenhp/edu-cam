<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="-apple-system, 'PingFang SC', sans-serif">
  <rect width="680" height="320" fill="#f6f8fb"/>
  <!-- BT 锥柄 -->
  <g transform="translate(120,60)">
    <polygon points="0,0 40,0 30,70 10,70" fill="#7c8ea3" stroke="#5b6b7b" stroke-width="2"/>
    <rect x="14" y="70" width="12" height="40" fill="#5b6b7b"/>
    <text x="20" y="135" text-anchor="middle" font-size="13" fill="#33414f">BT/7:24 锥柄</text>
  </g>
  <!-- HSK 空心锥 -->
  <g transform="translate(300,60)">
    <polygon points="0,0 40,0 28,60 12,60" fill="#0f9d8a" stroke="#0a7a6b" stroke-width="2"/>
    <rect x="14" y="60" width="12" height="45" fill="#0a7a6b"/>
    <text x="20" y="135" text-anchor="middle" font-size="13" fill="#0a7a6b">HSK 空心短锥</text>
  </g>
  <!-- 弹簧夹头 + 铣刀 -->
  <g transform="translate(470,60)">
    <polygon points="0,0 40,0 30,50 10,50" fill="#cdd9e6" stroke="#5b6b7b" stroke-width="2"/>
    <rect x="17" y="50" width="6" height="60" fill="#b8791b"/>
    <text x="20" y="135" text-anchor="middle" font-size="13" fill="#33414f">ER 夹头+铣刀</text>
  </g>
  <text x="40" y="210" font-size="13" fill="#33414f">刀柄系统决定：刚性、跳动精度、换刀重复定位</text>
  <text x="40" y="234" font-size="13" fill="#33414f">HSK 因端面+锥面双面定位，高速下刚性优于 BT</text>
  <text x="40" y="262" font-size="12" fill="#6b7884">刀具材料：高速钢(HSS) / 硬质合金 / 涂层(PVD/CVD) / CBN / PCD</text>
</svg>
