<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="-apple-system, 'PingFang SC', sans-serif">
  <rect width="680" height="400" fill="#f6f8fb"/>
  <text x="24" y="30" font-size="16" font-weight="700" fill="#33414f">辅助加工：在传统切削上叠加"能量场"</text>

  <!-- Panel 1: LAM -->
  <rect x="16" y="46" width="312" height="336" fill="#ffffff" stroke="#cdd9e6" stroke-width="1" rx="8"/>
  <text x="32" y="74" font-size="14" font-weight="700" fill="#1f6feb">激光辅助加工 LAM</text>
  <text x="32" y="94" font-size="11" fill="#6b7884">激光预热软化难切削材料</text>

  <!-- laser source -->
  <rect x="36" y="108" width="42" height="26" fill="#f0a93b" stroke="#d98a1f" stroke-width="1" rx="3"/>
  <text x="57" y="125" font-size="10" fill="#fff" text-anchor="middle">激光</text>
  <!-- laser beam -->
  <g stroke="#f0a93b" stroke-width="2">
    <line x1="78" y1="121" x2="150" y2="170"/>
    <line x1="82" y1="116" x2="158" y2="168"/>
  </g>
  <circle cx="155" cy="170" r="4" fill="#f0a93b"/>
  <!-- heat zone -->
  <rect x="120" y="178" width="74" height="13" fill="#f6c873" opacity="0.9"/>
  <!-- workpiece -->
  <rect x="80" y="191" width="222" height="56" fill="#cdd9e6" stroke="#7c8ea3" stroke-width="2"/>
  <text x="191" y="223" font-size="12" fill="#33414f" text-anchor="middle">难切削工件（如 Inconel 718）</text>
  <!-- cutting tool -->
  <rect x="190" y="98" width="20" height="26" fill="#5b6b7b"/>
  <polygon points="200,124 214,164 186,164" fill="#39506b"/>
  <text x="222" y="148" font-size="11" fill="#33414f">刀具</text>
  <!-- force arrow -->
  <g stroke="#0f9d8a" stroke-width="2" fill="#0f9d8a">
    <line x1="250" y1="150" x2="250" y2="188"/>
    <polygon points="250,194 245,186 255,186"/>
    <text x="258" y="178" font-size="11" stroke="none">切削力↓</text>
  </g>
  <text x="32" y="290" font-size="11" fill="#33414f">原理：局部激光加热 → 材料</text>
  <text x="32" y="308" font-size="11" fill="#33414f">屈服强度下降 → 更易切除</text>
  <text x="32" y="336" font-size="11" fill="#6b7884">效果：切削力↓20–40%，</text>
  <text x="32" y="354" font-size="11" fill="#6b7884">刀具寿命/表面质量显著改善</text>
  <text x="32" y="372" font-size="10" fill="#9aa7b4">主攻：难切削金属（高温合金/钛合金）</text>

  <!-- Panel 2: RUM -->
  <rect x="352" y="46" width="312" height="336" fill="#ffffff" stroke="#cdd9e6" stroke-width="1" rx="8"/>
  <text x="368" y="74" font-size="14" font-weight="700" fill="#1f6feb">旋转超声加工 RUM</text>
  <text x="368" y="94" font-size="11" fill="#6b7884">高频微振动加工硬脆材料</text>

  <!-- ultrasonic actuator -->
  <rect x="468" y="100" width="40" height="38" fill="#0f9d8a" stroke="#0b8a78" stroke-width="1" rx="3"/>
  <text x="488" y="123" font-size="10" fill="#fff" text-anchor="middle">超声</text>
  <!-- tool -->
  <rect x="478" y="138" width="20" height="42" fill="#5b6b7b"/>
  <polygon points="478,180 498,180 488,200" fill="#39506b"/>
  <!-- vibration arrows -->
  <g stroke="#0f9d8a" stroke-width="2">
    <line x1="514" y1="150" x2="514" y2="138"/>
    <line x1="514" y1="172" x2="514" y2="184"/>
    <polygon points="514,134 510,142 518,142"/>
    <polygon points="514,188 510,180 518,180"/>
  </g>
  <text x="524" y="168" font-size="10" fill="#0f9d8a">振动</text>
  <!-- workpiece -->
  <rect x="392" y="200" width="200" height="48" fill="#bcd6e6" stroke="#7c8ea3" stroke-width="2"/>
  <text x="492" y="228" font-size="12" fill="#33414f" text-anchor="middle">硬脆材料（陶瓷/玻璃/碳化钨）</text>
  <!-- clean edge note -->
  <text x="368" y="290" font-size="11" fill="#33414f">原理：刀具叠加 15–40kHz 纵向</text>
  <text x="368" y="308" font-size="11" fill="#33414f">微振动 → 脉冲式接触，减少崩边</text>
  <text x="368" y="336" font-size="11" fill="#6b7884">效果：加工力↓达50%，亚表面损伤</text>
  <text x="368" y="354" font-size="11" fill="#6b7884">↓40%，Ra 可达 ≤0.1µm</text>
  <text x="368" y="372" font-size="10" fill="#9aa7b4">主攻：硬脆先进材料（陶瓷/玻璃/复材）</text>
</svg>
