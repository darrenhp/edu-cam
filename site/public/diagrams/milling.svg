<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="-apple-system, 'PingFang SC', sans-serif">
  <rect width="680" height="340" fill="#f6f8fb"/>
  <!-- 坐标系 -->
  <g stroke="#9aa7b4" stroke-width="1.5" font-size="13" fill="#6b7884">
    <line x1="60" y1="280" x2="60" y2="60"/>
    <line x1="60" y1="280" x2="360" y2="280"/>
    <line x1="60" y1="280" x2="120" y2="320"/>
    <text x="50" y="70" text-anchor="end">Z</text>
    <text x="370" y="296">X</text>
    <text x="128" y="334">Y</text>
  </g>
  <!-- 工件 -->
  <rect x="120" y="230" width="240" height="50" fill="#cdd9e6" stroke="#7c8ea3" stroke-width="2"/>
  <text x="240" y="260" text-anchor="middle" font-size="14" fill="#33414f">工件 (毛坯)</text>
  <!-- 刀具 旋转立铣刀 -->
  <g transform="translate(240,90)">
    <rect x="-12" y="0" width="24" height="70" rx="4" fill="#5b6b7b"/>
    <g stroke="#39506b" stroke-width="2">
      <path d="M-12 8 q8 14 0 28 q-8 14 0 28"/>
      <path d="M12 8 q-8 14 0 28 q8 14 0 28"/>
    </g>
    <circle cx="0" cy="-4" r="6" fill="#1f6feb"/>
    <text x="0" y="-18" text-anchor="middle" font-size="14" fill="#1450b0">立铣刀 (旋转)</text>
  </g>
  <!-- 切屑 -->
  <g fill="#f0a93b">
    <path d="M214 150 q-14 -6 -10 -20 q10 6 10 20" />
    <path d="M262 150 q14 -6 10 -20 q-10 6 -10 20" />
  </g>
  <!-- 进给箭头 -->
  <g stroke="#0f9d8a" stroke-width="2" fill="#0f9d8a">
    <line x1="300" y1="125" x2="340" y2="125"/>
    <polygon points="340,125 332,121 332,129"/>
    <text x="345" y="129" font-size="12" stroke="none">进给 F</text>
  </g>
  <text x="430" y="200" font-size="14" fill="#33414f">原理：旋转的刀具</text>
  <text x="430" y="222" font-size="14" fill="#33414f">沿 X/Y 平移、Z 分层</text>
  <text x="430" y="244" font-size="14" fill="#33414f">去除材料</text>
</svg>
