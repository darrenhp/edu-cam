<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="-apple-system, 'PingFang SC', sans-serif">
  <rect width="680" height="340" fill="#f6f8fb"/>
  <!-- 叶片轮廓 -->
  <g transform="translate(120,170)">
    <path d="M-70 0 C-30 -55 30 -55 80 0 C30 55 -30 55 -70 0 Z" fill="#cdd9e6" stroke="#7c8ea3" stroke-width="2"/>
    <line x1="0" y1="-52" x2="0" y2="52" stroke="#9aa7b4" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="5" y="70" font-size="12" fill="#33414f">叶片（薄壁曲面）</text>
  </g>
  <!-- 工艺路线 -->
  <g font-size="12" fill="#33414f">
    <rect x="300" y="60" width="150" height="40" rx="6" fill="#e6edf4" stroke="#7c8ea3"/>
    <text x="375" y="84" text-anchor="middle">① 锻造毛坯</text>
    <rect x="300" y="130" width="150" height="40" rx="6" fill="#e6edf4" stroke="#7c8ea3"/>
    <text x="375" y="154" text-anchor="middle">② 五轴粗加工</text>
    <rect x="300" y="200" width="150" height="40" rx="6" fill="#e6edf4" stroke="#7c8ea3"/>
    <text x="375" y="224" text-anchor="middle">③ 五轴精加工(型面)</text>
    <rect x="300" y="270" width="150" height="40" rx="6" fill="#e6edf4" stroke="#7c8ea3"/>
    <text x="375" y="294" text-anchor="middle">④ 抛光 + 在机检测</text>
  </g>
  <g stroke="#0f9d8a" stroke-width="2" fill="none">
    <line x1="375" y1="100" x2="375" y2="128"/>
    <line x1="375" y1="170" x2="375" y2="198"/>
    <line x1="375" y1="240" x2="375" y2="268"/>
    <polygon points="375,128 371,120 379,120" fill="#0f9d8a"/>
    <polygon points="375,198 371,190 379,190" fill="#0f9d8a"/>
    <polygon points="375,268 371,260 379,260" fill="#0f9d8a"/>
  </g>
  <text x="500" y="170" font-size="12" fill="#6b7884">难点：薄壁易振、</text>
  <text x="500" y="190" font-size="12" fill="#6b7884">叶型精度靠五轴</text>
  <text x="500" y="210" font-size="12" fill="#6b7884">刀轴摆动控制</text>
</svg>
